                return;
            }

            pageData.forEach(item => {
                const article = document.createElement('article');
                article.className = 'bg-white rounded-xl shadow-sm border border-slate-200 p-6 sm:p-8 hover:shadow-md transition-shadow duration-300';
                
                article.innerHTML = `
                    <div class="flex items-center mb-4">
                        <span class="text-xs font-bold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2 py-1 rounded">
                            ${item.category}
                        </span>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-900 mb-6">${item.title}</h2>
                    ${item.content}
                `;
                contentContainer.appendChild(article);
            });
            
            // Scroll to top of content slightly smoothly
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderPagination(totalPages) {
            paginationContainer.innerHTML = '';
            
            if (totalPages <= 1) return;

            // Prev Button
            const prevBtn = document.createElement('button');
            prevBtn.textContent = 'Previous';
            prevBtn.disabled = currentPage === 1;
            prevBtn.className = `px-4 py-2 rounded-lg text-sm font-medium border ${
                prevBtn.disabled ? 'bg-slate-100 text-slate-400 cursor-not-allowed border-slate-200' : 'bg-white text-slate-700 hover:bg-slate-50 border-slate-300 hover:text-indigo-600 transition-colors'
            }`;
            prevBtn.onclick = () => {
                if (currentPage > 1) {
                    currentPage--;
                    updateView();
                }
            };
            paginationContainer.appendChild(prevBtn);

            // Page numbers
            for (let i = 1; i <= totalPages; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.textContent = i;
                const isActive = i === currentPage;
                
                pageBtn.className = `w-10 h-10 rounded-lg text-sm font-medium border transition-colors ${
                    isActive 
                    ? 'bg-indigo-600 text-white border-indigo-600' 
                    : 'bg-white text-slate-700 hover:bg-slate-50 border-slate-300 hover:text-indigo-600'
                }`;
                
                pageBtn.onclick = () => {
                    currentPage = i;
                    updateView();
                };
                paginationContainer.appendChild(pageBtn);
            }

            // Next Button
            const nextBtn = document.createElement('button');
            nextBtn.textContent = 'Next';
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.className = `px-4 py-2 rounded-lg text-sm font-medium border ${
                nextBtn.disabled ? 'bg-slate-100 text-slate-400 cursor-not-allowed border-slate-200' : 'bg-white text-slate-700 hover:bg-slate-50 border-slate-300 hover:text-indigo-600 transition-colors'
            }`;
            nextBtn.onclick = () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    updateView();
                }
            };
            paginationContainer.appendChild(nextBtn);
        }

        // Initialize App
        init();
    </script>
</body>
</html>
