                        <h3>۱. تاکید مجدد بر «کیفیت زندگی» (Lebensqualität)</h3>
                        <p>برای دهه‌ها، هدف نهایی <em>Pflichtbewusstsein</em> (احساس وظیفه و وظیفه‌شناسی) نسبت به سیستم بود. اکنون، نسل جدید به سایر کشورها نگاه می‌کند و متوجه می‌شود که شادی، هنر خودجوش، وعده‌های غذایی طولانی و ارتباط عمیق انسانی چیزهایی هستند که واقعاً زندگی را ارزش زیستن می‌کنند. جوانان آلمانی به طور فزاینده‌ای در حال رد کردن مسیر سنتی فدا کردن سلامت روان خود فقط برای نگه داشتن آلمان در صدر نردبان اقتصادی هستند.</p>

                        <h3>۲. تضاد فرهنگی: نسل در برابر سیستم</h3>
                        <p>برخلاف والدینشان، آلمانی‌های جوان‌تر آشکارا درباره روان‌درمانی، آسیب‌های عاطفی و آسیب‌های ناشی از سردی احساسی بحث می‌کنند. کارفرمایان در آلمان در حال حاضر با مشکلاتی مواجه هستند زیرا نسل جوان خواستار هفته‌های کاری کوتاه‌تر، اوقات فراغت بیشتر و تمرکز بر زندگی خارج از دفتر است. آنها می‌خواهند رؤیاهای شخصی خود را دنبال کنند و هنرهای خلاقانه را کشف کنند تا اینکه زندگی خود را وقف خروجی صنعتی کنند.</p>

                        <h3>۳. مسیری طولانی برای تخلیه احساسی واقعی</h3>
                        <p>در حالی که طرز فکر در حال تغییر است، فراموش کردن قرن‌ها شرطی‌سازی سیستماتیک فوق‌العاده دشوار است. حتی زمانی که جوانان آلمانی می‌خواهند گرم‌تر و ابرازگرتر باشند، اغلب باز هم با مشکلاتی مواجه می‌شوند زیرا زیرساخت‌های جامعه آنها هنوز بر پایه منطق سرد بنا شده است. با این حال، میل به زندگی‌ای پر از احساسات واقعی، هنر زیبا و همدلی اصیل در نهایت در حال شکستن زره سنگین گذشته است.</p>

                `
            }
        ];

        // App State
        let currentCategory = 'همه';
        let currentPage = 1;
        const itemsPerPage = 3;

        // Elements
        const categoryContainer = document.getElementById('category-container');
        const contentContainer = document.getElementById('content-container');
        const paginationContainer = document.getElementById('pagination-container');

        // Extract unique categories
        const categories = ['همه', ...new Set(culturalData.map(item => item.category))];

        function init() {
            renderCategories();
            updateView();
        }

        function updateView() {
            const filteredData = currentCategory === 'همه' 
                ? culturalData 
                : culturalData.filter(item => item.category === currentCategory);
            
            const totalPages = Math.ceil(filteredData.length / itemsPerPage);
            
            // Boundary checks
            if (currentPage > totalPages && totalPages > 0) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            renderContent(filteredData);
            renderPagination(totalPages);
        }

        function renderCategories() {
            categoryContainer.innerHTML = '';
            categories.forEach(category => {
                const btn = document.createElement('button');
                btn.textContent = category;
                const isActive = category === currentCategory;
                
                btn.className = `px-4 py-2 rounded-full text-sm font-medium transition-colors duration-200 ${
                    isActive 
                    ? 'bg-indigo-600 text-white shadow-md' 
                    : 'bg-white text-slate-600 hover:bg-slate-200 border border-slate-200 shadow-sm'
                }`;
                
                btn.onclick = () => {
                    currentCategory = category;
                    currentPage = 1; // Reset to page 1 on category change
                    renderCategories(); // Re-render to update active styling
                    updateView();
                };
                
                categoryContainer.appendChild(btn);
            });
        }

        function renderContent(data) {
            contentContainer.innerHTML = '';
            
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageData = data.slice(startIndex, endIndex);

            if (pageData.length === 0) {
                contentContainer.innerHTML = '<p class="text-center text-slate-500 py-10">محتوایی برای این دسته‌بندی یافت نشد.</p>';
                return;
            }

            pageData.forEach(item => {
                const article = document.createElement('article');
                article.className = 'bg-white rounded-xl shadow-sm border border-slate-200 p-6 sm:p-8 hover:shadow-md transition-shadow duration-300';
                
                article.innerHTML = `
                    <div class="flex items-center mb-4">
                        <span class="text-xs font-bold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2 py-1 rounded">
                            ${item.category}
                        </span>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-900 mb-6 leading-relaxed">${item.title}</h2>
                    ${item.content}
                `;
                contentContainer.appendChild(article);
            });
            
            // Scroll to top of content slightly smoothly
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderPagination(totalPages) {
            paginationContainer.innerHTML = '';
            
            if (totalPages <= 1) return;

            // Prev Button
            const prevBtn = document.createElement('button');
            prevBtn.textContent = 'قبلی';
            prevBtn.disabled = currentPage === 1;
            prevBtn.className = `px-4 py-2 rounded-lg text-sm font-medium border ${
                prevBtn.disabled ? 'bg-slate-100 text-slate-400 cursor-not-allowed border-slate-200' : 'bg-white text-slate-700 hover:bg-slate-50 border-slate-300 hover:text-indigo-600 transition-colors'
            }`;
            prevBtn.onclick = () => {
                if (currentPage > 1) {
                    currentPage--;
                    updateView();
                }
            };
            paginationContainer.appendChild(prevBtn);

            // Page numbers
            for (let i = 1; i <= totalPages; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.textContent = i;
                const isActive = i === currentPage;
                
                pageBtn.className = `w-10 h-10 flex items-center justify-center rounded-lg text-sm font-medium border transition-colors ${
                    isActive 
                    ? 'bg-indigo-600 text-white border-indigo-600' 
                    : 'bg-white text-slate-700 hover:bg-slate-50 border-slate-300 hover:text-indigo-600'
                }`;
                
                pageBtn.onclick = () => {
                    currentPage = i;
                    updateView();
                };
                paginationContainer.appendChild(pageBtn);
            }

            // Next Button
            const nextBtn = document.createElement('button');
            nextBtn.textContent = 'بعدی';
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.className = `px-4 py-2 rounded-lg text-sm font-medium border ${
                nextBtn.disabled ? 'bg-slate-100 text-slate-400 cursor-not-allowed border-slate-200' : 'bg-white text-slate-700 hover:bg-slate-50 border-slate-300 hover:text-indigo-600 transition-colors'
            }`;
            nextBtn.onclick = () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    updateView();
                }
            };
            paginationContainer.appendChild(nextBtn);
        }

        // Initialize App
        init();
    </script>
