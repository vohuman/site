<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bahman Soltani</title>
    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <script src="main.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link href="styles.css" rel="stylesheet">
    
</head>
<body>

    <div class="mobile-header">
        <span class="fw-bold fs-5 text-dark">Bahman Soltani</span>
        <button id="mobile-menu-btn" class="btn btn-light btn-sm">
            <i class="fa-solid fa-bars"></i>
        </button>
    </div>

    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <div class="d-flex" id="wrapper">
        
        <div id="sidebar-wrapper">
            <div class="p-4 border-bottom border-secondary">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h1 class="h5 fw-bold mb-0">Resume</h1>
                        <small class="text-muted">Interactive CV</small>
                    </div>
                    
                    <button id="close-sidebar" class="btn btn-sm btn-dark d-md-none">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>

            <div class="flex-grow-1 overflow-auto py-3">
                <ul class="list-unstyled px-3" id="nav-links">
                    
                    
                </ul>
            </div>

            <div class="p-3 bg-dark border-top border-secondary">
                <div class="d-flex bg-secondary bg-opacity-25 rounded p-1 mb-3">
                    <button id="btn-en" class="btn btn-sm flex-fill lang-btn active rounded" disabled>English</button>
                    <button id="btn-de" class="btn btn-sm flex-fill lang-btn rounded" disabled>Deutsch</button>
                </div>
                <div class="d-flex align-items-center gap-2 px-1">
                    <div style="width: 35px; height: 35px; border-radius: 50%; overflow: hidden;">
                        <img src="https://vohuman.github.io/assets/Bild.jpg" class="w-100 h-100 object-fit-cover">
                    </div>
                    <div class="small lh-sm">
                        <div class="fw-bold">Bahman Soltani</div>
                        <div class="text-muted" style="font-size: 0.75rem;">Senior Full Stack Developer</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="page-content-wrapper">
            <div class="container-fluid" style="max-width: 1000px;">
                <div id="main-content">
                    
                    <div class="d-flex justify-content-center align-items-center" style="height: 60vh;">
                        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
